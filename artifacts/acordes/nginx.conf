server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # PWA: nunca cacheie o service worker / manifesto, senão updates do app
    # ficam "presos" no navegador do usuário.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Assets com hash no nome (JS/CSS do Vite) podem cachear "para sempre".
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html (wouter faz o roteamento).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
